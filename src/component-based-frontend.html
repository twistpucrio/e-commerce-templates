<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Component-Based</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: space-around; padding: 20px; }
        #app { display: contents; }
        #products, #cart { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 45%; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .product-item { display: flex; align-items: center; margin-bottom: 15px; }
        .product-item img { border-radius: 4px; margin-right: 15px; }
        .product-item .info { flex-grow: 1; }
        .product-item .price { font-weight: bold; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #cart-total { font-size: 1.2em; font-weight: bold; text-align: right; margin-top: 20px; }
        #checkout-btn { background-color: #28a745; display: block; width: 100%; margin-top: 15px; padding: 12px; font-size: 1.1em; }
        #checkout-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div id="app"></div>

    <script src="./core/EcommerceAPI.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const api = new EcommerceAPI();
            const appContainer = document.getElementById('app');

            // --- Components ---
            // Components are functions that return an HTML string.

            const ProductItem = (product) => `
                <div class="product-item">
                    <img src="${product.image}" alt="${product.name}" width="50" height="50">
                    <div class="info">
                        <div>${product.name}</div>
                        <div class="price">$${product.price.toFixed(2)}</div>
                    </div>
                    <button class="add-to-cart-btn" data-product-id="${product.id}">Add to Cart</button>
                </div>
            `;

            const ProductList = (products) => `
                <div id="products">
                    <h2>Products</h2>
                    <div id="product-list">
                        ${products.map(ProductItem).join('')}
                    </div>
                </div>
            `;

            const CartView = (cart, allProducts) => {
                const cartItemDetails = cart.products.map(productId => allProducts.find(p => p.id === productId));
                
                let itemsHtml = 'Your cart is empty.';
                if (cartItemDetails.length > 0) {
                    itemsHtml = cartItemDetails.map(item => 
                        (item ? `<div>${item.name} - $${item.price.toFixed(2)}</div>` : '')
                    ).join('');
                }

                return `
                    <div id="cart">
                        <h2>Shopping Cart</h2>
                        <div id="cart-items">${itemsHtml}</div>
                        <div id="cart-total">Total: $${cart.total.toFixed(2)}</div>
                        <button id="checkout-btn">Checkout</button>
                    </div>
                `;
            };

            // --- Main App Logic ---

            const App = {
                init() {
                    this.addEventListeners();
                    this.render();
                },

                render() {
                    const allProducts = api.listProducts();
                    const cart = api.getCart();
                    
                    appContainer.innerHTML = `
                        ${ProductList(allProducts)}
                        ${CartView(cart, allProducts)}
                    `;
                },
                
                addEventListeners() {
                    // Use event delegation on the app container
                    appContainer.addEventListener('click', (event) => {
                        if (event.target.matches('.add-to-cart-btn')) {
                            const productId = parseInt(event.target.dataset.productId, 10);
                            api.addToCart(productId);
                            this.render(); // Re-render the entire app to reflect changes
                        }

                        if (event.target.matches('#checkout-btn')) {
                            const order = api.checkout();
                            if (order.success && order.products.length > 0) {
                                alert(`Checkout successful!\\nOrder ID: ${order.orderId}\\nTotal: $${order.total.toFixed(2)}`);
                                this.render(); // Re-render to show the empty cart
                            } else {
                                alert('Your cart is empty.');
                            }
                        }
                    });
                }
            };

            // Initial render and setup
            App.init();
        });
    </script>
</body>
</html>
