<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - E-commerce</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; font-size: 1.2em; }
        #products { max-width: 900px; margin: auto; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .product-item { display: flex; align-items: center; margin-bottom: 15px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
        .product-item img { border-radius: 4px; margin-right: 15px; }
        .product-item .info { flex-grow: 1; }
        .product-item .price { font-weight: bold; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <nav>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>

    <div id="products">
        <h1>Our Products</h1>
        <div id="product-list"></div>
    </div>

    <script src="./core/EcommerceAPI.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const api = new EcommerceAPI();
            const productListEl = document.getElementById('product-list');

            function renderProducts() {
                const products = api.listProducts();
                productListEl.innerHTML = '';

                products.forEach(product => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'product-item';
                    itemEl.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" width="80" height="80">
                        <div class="info">
                            <h3>${product.name}</h3>
                            <div class="price">$${product.price.toFixed(2)}</div>
                        </div>
                        <button data-product-id="${product.id}">Add to Cart</button>
                    `;
                    productListEl.appendChild(itemEl);
                });
            }

            productListEl.addEventListener('click', (event) => {
                if (event.target.tagName === 'BUTTON' && event.target.dataset.productId) {
                    const productId = parseInt(event.target.dataset.productId, 10);
                    api.addToCart(productId);
                    alert(`${api.listProducts().find(p => p.id === productId).name} added to cart!`);
                }
            });

            renderProducts();
        });
    </script>
</body>
</html>
